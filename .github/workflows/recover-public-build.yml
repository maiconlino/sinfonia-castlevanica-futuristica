name: Recover public browser build
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/recover-public-build.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Retrieve only anonymous public frontend resources
        run: |
          mkdir -p recovered
          python3 - <<'PY'
          import urllib.request, urllib.parse, pathlib, re, json, hashlib
          origin='https://sinfonia-castlevanica-futuristica.maiconheverton.chatgpt.site'
          queue=['/','/demo/']; seen=set(); report=[]
          extensions={'.js','.mjs','.css','.json','.png','.webp','.jpg','.jpeg','.svg','.ico','.mid','.midi','.wav','.ogg','.mp3','.map','.woff','.woff2'}
          while queue and len(seen)<150:
              path=queue.pop(0)
              if path in seen or path.startswith('/api/') or path.startswith('/auth/'): continue
              seen.add(path)
              url=origin+path
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'SinfonIA source backup, public static files only'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=r.read(15000000); final=r.geturl(); mime=r.headers.get('Content-Type','')
                  if urllib.parse.urlparse(final).netloc != urllib.parse.urlparse(origin).netloc:
                      report.append({'path':path,'error':'External redirect, not followed into private source recovery'});continue
                  target=path.split('?',1)[0].lstrip('/')
                  if not target or target.endswith('/'): target+='index.html'
                  p=pathlib.Path('recovered/public')/target
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                  report.append({'path':path,'file':str(p),'bytes':len(data),'type':mime,'sha256':hashlib.sha256(data).hexdigest()})
                  if any(x in mime for x in ('text/','javascript','json')):
                      text=data.decode('utf-8',errors='replace')
                      links=re.findall(r'''(?:src|href)=["']([^"']+)["']|url\(["']?([^\)"']+)|["']([^"'\s]+\.(?:js|mjs|json|png|webp|svg|mid|midi|wav|ogg|mp3|css|map))["']''',text)
                      for entry in links:
                          raw=next((x for x in entry if x),'')
                          resolved=urllib.parse.urlparse(urllib.parse.urljoin(url,raw))
                          if resolved.netloc==urllib.parse.urlparse(origin).netloc and pathlib.PurePosixPath(resolved.path).suffix in extensions:
                              queue.append(resolved.path+('?' + resolved.query if resolved.query else ''))
              except Exception as e:
                  report.append({'path':path,'error':str(e)})
          pathlib.Path('recovered/recovery-report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sinfonia-public-build-recovery
          path: recovered/
          retention-days: 7
