name: Preserve browser game source and public artwork
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/preserve-browser-build.yml']
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sinfonia-public-build-recovery
          run-id: 35097693704
          github-token: ${{ github.token }}
          path: recovered
      - name: Preserve public files and record resources that cannot be recovered
        run: |
          python3 - <<'PY'
          import pathlib, shutil, re, json, hashlib
          src=pathlib.Path('recovered/public'); dest=pathlib.Path('public')
          shutil.copytree(src,dest,dirs_exist_ok=True)
          shutil.rmtree(dest/'cdn-cgi',ignore_errors=True)
          for p in dest.rglob('*.html'):
              text=p.read_text()
              text=re.sub(r'<script>\(function\(\)\{function c\(\).*?__CF\$cv\$params.*?</script>','',text,flags=re.S)
              p.write_text(text)
          missing=['assets/atlas-01-library-crypt-garden-reservoir.webp','assets/atlas-02-clocktower-observatory-core-throne.webp','assets/atlas-03-gate-forge-rooftop-vault.webp']
          manifest={'origin':'https://sinfonia-castlevanica-futuristica.maiconheverton.chatgpt.site','scope':'Public browser campaign, demo and recoverable artwork only. Original private server source and player database are not included.','removed':'Hosting-provider challenge injection only','unrecovered_artwork':missing,'unrecovered_artwork_reason':'The public retrieval of these referenced files returned HTTP 403. No access-control bypass was attempted. The original renderer has a fallback.','files':{str(p.relative_to(dest)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(dest.rglob('*')) if p.is_file()}}
          pathlib.Path('PUBLIC-BUILD-MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          pathlib.Path('package.json').write_text(json.dumps({'name':'sinfonia-castlevanica-futuristica','private':True,'type':'module','scripts':{'start':'python3 -m http.server 8080 --directory public'}},indent=2)+'\n')
          pathlib.Path('.gitignore').write_text('node_modules/\n.env\n.env.*\n*.sqlite\n*.db\nrecovered/\n')
          print('Recovered public files:',len(manifest['files']))
          PY
      - name: Check JavaScript syntax and campaign boot
        run: |
          find public -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --input-type=module - <<'JS'
          import {Campaign,DATA} from './public/campaign-engine.mjs';
          const g=new Campaign(()=>{});g.start();
          for(let i=0;i<120;i++)g.update(1/60,{right:true,attack:true});
          if(DATA.rooms.length!==60||DATA.bosses.length!==10||DATA.items.length!==60)throw Error('Unexpected content counts');
          console.log('Campaign boot and 120 update ticks passed.');
          JS
      - name: Commit browser source and assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public PUBLIC-BUILD-MANIFEST.json package.json .gitignore
          git diff --cached --quiet || git commit -m 'Preserve recoverable browser source and explicitly document missing private components'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: preserved-browser-game
          path: |
            public/
            PUBLIC-BUILD-MANIFEST.json
            package.json
          retention-days: 7
