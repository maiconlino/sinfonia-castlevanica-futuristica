name: Verify and apply secret passage hotfix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/secret-passages-hotfix.yml'
permissions:
  contents: write
concurrency:
  group: sinfonia-orchard-hotfix
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the reviewed source change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          source = Path('public/campaign-engine.mjs')
          patch = Path('patches/2026-09-17-secret-passages.patch')
          before = 'a95e1142162904feefe2672b497dc91eb3a803768714d76e39babac262cd5e2f'
          after = '746023678edc9360002f6d6eb1417c4a580e3eb6158090593b92740be81099c4'
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(patch) == '36328a9695302bbb15ba68f28d870e3e1da4820fd7135ba7e7c5a09fef7c23da', 'Patch integrity check failed'
          if digest(source) != after:
              assert digest(source) == before, 'Source changed; review instead of overwriting it'
              subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
              subprocess.run(['git', 'apply', str(patch)], check=True)
          assert digest(source) == after, 'Patched source differs from the tested file'
          print('Reviewed source SHA256:', after)
          PY
      - name: Verify syntax and legacy save regression tests
        run: |
          node --check public/campaign-engine.mjs
          node --test tests/secret-passages.test.mjs | tee secret-passage-results.tap
      - name: Commit the verified fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/campaign-engine.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Fix secret room return passages and recover legacy orchard saves'
            git push origin HEAD:main
          fi
          echo 'This workflow updates GitHub only. It does not deploy to the ChatGPT Sites host or access any account database.'
      - uses: actions/upload-artifact@v4
        with:
          name: verified-orchard-hotfix
          path: |
            public/campaign-engine.mjs
            tests/secret-passages.test.mjs
            patches/2026-09-17-secret-passages.patch
            secret-passage-results.tap
          retention-days: 30
